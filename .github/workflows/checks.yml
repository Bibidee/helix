name: Helix checks

on:
  push:
  pull_request:

jobs:
  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Prepare pinned GenVM Direct Mode bundle
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/gltest-direct"
          BUNDLE="$CACHE_DIR/genvm-universal-v0.3.0-rc7.tar.xz"
          URL="https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz"
          EXPECTED_SHA="e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67"
          mkdir -p "$CACHE_DIR"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$URL" --output "$BUNDLE"
          echo "$EXPECTED_SHA  $BUNDLE" | sha256sum --check --strict
      - run: python scripts/preflight.py
