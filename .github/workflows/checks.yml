name: Helix checks

on:
  push:
  pull_request:

jobs:
  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/direct -q
      - run: python -c "import ast, pathlib; ast.parse(pathlib.Path('contracts/helix.py').read_text(encoding='utf-8'))"
